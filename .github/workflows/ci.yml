name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', 'stable']
        exclude:
          # Go 1.22 test binaries abort on current macOS runners
          # ("dyld: missing LC_UUID load command"); the linker gained
          # LC_UUID in Go 1.23. 1.22 still runs on Linux and Windows.
          - os: macos-latest
            go: '1.22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build .
